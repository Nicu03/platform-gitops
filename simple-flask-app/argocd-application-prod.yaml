apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-flask-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nicu03/platform-gitops.git
    targetRevision: main
    path: simple-flask-app/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: simple-flask-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
